<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links Favoritos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body">
                        <!-- HEADER -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3 class="mb-0">
                                <i class="bi bi-bookmark-star"></i> Links Favoritos
                            </h3>

                            <button onclick="toggleTheme()" class="btn btn-outline-secondary">
                                <i id="themeIcon" class="bi bi-moon"></i>
                            </button>
                        </div>
                        <!-- ALERTA -->
                        <div id="alerta" class="alert alert-danger d-none">
                            <i class="bi bi-exclamation-triangle"></i>
                            Preencha todos os campos!
                        </div>
                        <!-- FORM -->
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <input type="text" id="descricao" class="form-control"
                                    placeholder="Descrição do link">
                            </div>
                            <div class="col-md-6">
                                <input type="text" id="endereco" class="form-control"
                                    placeholder="https://exemplo.com">
                            </div>
                        </div>
                        <div class="d-grid mb-3">
                            <button onclick="adicionarLink()" class="btn btn-primary">
                                <i class="bi bi-plus-circle"></i> Adicionar Link
                            </button>
                        </div>
                        <!-- LISTA -->
                        <ul id="listarLinks" class="list-group"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
